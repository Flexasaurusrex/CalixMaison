<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calix Maison - The House of Grails</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #C9A96E;
            --black: #1a1a1a;
            --white: #fafaf8;
            --off-white: #f5f5f3;
            --light-gray: #e8e8e6;
            --shadow-soft: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-medium: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-strong: 0 8px 32px rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--white);
            color: var(--black);
            line-height: 1.6;
        }

        /* HEADER */
        header {
            background: var(--black);
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-medium);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .logo {
            height: 80px;
            width: auto;
        }

        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--gold);
            letter-spacing: 0.5px;
            font-style: italic;
        }

        nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--gold);
        }

        .admin-btn {
            background: var(--gold);
            color: var(--black);
            padding: 0.5rem 1.5rem;
            border: none;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            background: var(--white);
            transform: translateY(-1px);
            box-shadow: var(--shadow-medium);
        }

        /* LANDING PAGE */
        .landing-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.6s ease;
        }

        .landing-page.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .landing-video {
            width: 100%;
            max-width: 1200px;
            height: auto;
            margin-bottom: 3rem;
            display: block;
        }

        .enter-btn {
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 1rem 3rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .enter-btn:hover {
            background: var(--gold);
            color: var(--black);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(201, 169, 110, 0.3);
        }

        /* MAIN CONTENT */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 4rem 3rem;
        }

        /* GRID LAYOUT */
        .auction-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: start;
        }

        /* LEFT COLUMN */
        .auction-info {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .auction-number {
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #999;
            font-weight: 400;
        }

        .artwork-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .artist-name {
            color: var(--gold);
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* CURATOR'S NOTE */
        .curators-note {
            background: var(--off-white);
            padding: 2.5rem;
            border-left: 3px solid var(--gold);
            box-shadow: var(--shadow-soft);
        }

        .curators-label {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .curators-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--black);
        }

        .edit-curator {
            width: 100%;
            min-height: 150px;
            padding: 1.5rem;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            line-height: 1.8;
            border: 2px solid var(--gold);
            background: var(--white);
            resize: vertical;
        }

        /* BIDDING SECTION */
        .bidding-section {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* COUNTDOWN */
        .countdown-container {
            background: var(--off-white);
            padding: 2rem;
            box-shadow: var(--shadow-soft);
        }

        .countdown-label {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 500;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            text-align: center;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
        }

        .time-value {
            font-size: 2.5rem;
            font-weight: 300;
            color: var(--black);
            font-family: 'Montserrat', sans-serif;
        }

        .time-label {
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #999;
            margin-top: 0.5rem;
        }

        /* CURRENT BID */
        .current-bid-section {
            background: var(--off-white);
            padding: 2rem;
            text-align: center;
            box-shadow: var(--shadow-soft);
        }

        .bid-label {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .current-bid-amount {
            font-size: 3rem;
            font-weight: 300;
            color: var(--gold);
            font-family: 'Montserrat', sans-serif;
        }

        /* BID INPUT */
        .bid-input-section {
            display: flex;
            gap: 1rem;
        }

        .bid-input {
            flex: 1;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            border: 2px solid var(--light-gray);
            background: var(--white);
            transition: all 0.3s ease;
        }

        .bid-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.1);
        }

        .place-bid-btn {
            background: var(--black);
            color: var(--white);
            border: none;
            padding: 1rem 2.5rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .place-bid-btn:hover {
            background: var(--gold);
            color: var(--black);
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        /* BID HISTORY */
        .bid-history {
            background: var(--off-white);
            padding: 2rem;
            box-shadow: var(--shadow-soft);
        }

        .bid-history-label {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .bid-item {
            display: flex;
            justify-content: space-between;
            padding: 1rem 0;
            border-bottom: 1px solid var(--light-gray);
        }

        .bid-item:last-child {
            border-bottom: none;
        }

        .bid-amount {
            color: var(--gold);
            font-weight: 500;
        }

        .bid-time {
            color: #999;
            font-size: 0.9rem;
        }

        /* RIGHT COLUMN - ARTWORK */
        .artwork-display {
            position: sticky;
            top: 140px;
        }

        .artwork-card {
            background: var(--white);
            padding: 3rem;
            box-shadow: var(--shadow-strong);
        }

        .artwork-frame {
            background: var(--off-white);
            padding: 2.5rem;
            box-shadow: var(--shadow-soft);
            margin-bottom: 2rem;
        }

        .artwork-image {
            width: 100%;
            height: auto;
            display: block;
            box-shadow: var(--shadow-medium);
        }

        .artwork-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            font-size: 0.9rem;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .detail-label {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #999;
            font-weight: 500;
        }

        .detail-value {
            color: var(--black);
            font-weight: 400;
        }

        /* ADMIN INPUTS */
        .admin-input {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.5rem;
            font-family: 'Montserrat', sans-serif;
            border: 2px solid var(--gold);
            background: var(--white);
        }

        .admin-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.1);
        }

        /* IMAGE UPLOAD */
        .image-upload-section {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--off-white);
            border: 2px dashed var(--gold);
        }

        .image-upload-label {
            display: block;
            text-align: center;
            cursor: pointer;
            padding: 1rem;
            font-size: 0.9rem;
            color: var(--black);
        }

        input[type="file"] {
            display: none;
        }

        /* RESPONSIVE */
        @media (max-width: 968px) {
            .auction-grid {
                grid-template-columns: 1fr;
                gap: 3rem;
            }

            .artwork-display {
                position: static;
            }

            .landing-video {
                max-width: 95%;
                max-height: 70vh;
            }

            .logo {
                height: 60px;
            }

            .tagline {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function CalixMaison() {
            const [showLanding, setShowLanding] = useState(true);
            const [adminMode, setAdminMode] = useState(false);
            
            // Auction data state
            const [auctionData, setAuctionData] = useState({
                auctionNumber: 'WEEKLY CURATED AUCTION NO. 001',
                title: 'Convergence in Monochrome',
                artist: 'Elena Rousseau',
                curatorNote: "In Rousseau's latest work, we encounter a meditation on the space between intention and gesture. The layered monochromatic planes speak to a deliberate restraint—each mark considered, each absence as vital as presence. This piece emerged from her residency in Kyoto, where the philosophy of ma (間), the conscious use of negative space, profoundly influenced her practice. Here, Western gestural abstraction meets Eastern spatial consciousness, resulting in a work that breathes with quiet authority. The surface reveals itself slowly: what first appears as austere minimalism gradually unveils a complex topography of subtle tonalities and textures. It is this patience, this refusal to seduce immediately, that marks Rousseau as one of the most compelling voices in contemporary abstraction.",
                year: '2024',
                medium: 'Oil and graphite on canvas',
                dimensions: '48 × 36 inches',
                edition: 'Unique work',
                currentBid: 5000,
                bidHistory: [
                    { amount: 5000, time: '2 hours ago' },
                    { amount: 4500, time: '5 hours ago' },
                    { amount: 4000, time: '1 day ago' }
                ],
                imageUrl: 'https://images.unsplash.com/photo-1549887534-1541e9326642?w=800&q=80',
                endDate: new Date(Date.now() + 5 * 24 * 60 * 60 * 1000 + 14 * 60 * 60 * 1000) // 5 days, 14 hours from now
            });

            const [newBid, setNewBid] = useState('');
            const [timeLeft, setTimeLeft] = useState({});

            // Countdown timer
            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date().getTime();
                    const distance = auctionData.endDate - now;

                    setTimeLeft({
                        days: Math.floor(distance / (1000 * 60 * 60 * 24)),
                        hours: Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                        minutes: Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)),
                        seconds: Math.floor((distance % (1000 * 60)) / 1000)
                    });
                }, 1000);

                return () => clearInterval(timer);
            }, [auctionData.endDate]);

            const handleEnter = () => {
                setShowLanding(false);
            };

            const handlePlaceBid = () => {
                const bidAmount = parseFloat(newBid);
                if (bidAmount > auctionData.currentBid) {
                    const newBidHistory = [
                        { amount: bidAmount, time: 'Just now' },
                        ...auctionData.bidHistory
                    ];
                    setAuctionData({
                        ...auctionData,
                        currentBid: bidAmount,
                        bidHistory: newBidHistory
                    });
                    setNewBid('');
                }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setAuctionData({ ...auctionData, imageUrl: reader.result });
                    };
                    reader.readAsDataURL(file);
                }
            };

            return (
                <>
                    {/* LANDING PAGE */}
                    <div className={`landing-page ${!showLanding ? 'fade-out' : ''}`}>
                        <video className="landing-video" autoPlay loop muted playsInline>
                            <source src="assets/Calix_Maison_Symmetric.mp4" type="video/mp4" />
                        </video>
                        <button className="enter-btn" onClick={handleEnter}>
                            Enter Maison
                        </button>
                    </div>

                    {/* MAIN SITE */}
                    <header>
                        <div className="logo-container">
                            <img src="assets/CALIXMAISON.png" alt="Calix Maison" className="logo" />
                            <div className="tagline">The House of Grails</div>
                        </div>
                        <nav>
                            <a href="#current">Current Auction</a>
                            <a href="#archive">Archive</a>
                            <a href="#about">About</a>
                            <button className="admin-btn" onClick={() => setAdminMode(!adminMode)}>
                                Admin
                            </button>
                        </nav>
                    </header>

                    <main className="main-content">
                        <div className="auction-grid">
                            {/* LEFT COLUMN */}
                            <div className="auction-info">
                                <div>
                                    {adminMode ? (
                                        <input
                                            type="text"
                                            className="admin-input"
                                            value={auctionData.auctionNumber}
                                            onChange={(e) => setAuctionData({ ...auctionData, auctionNumber: e.target.value })}
                                            placeholder="Auction Number"
                                        />
                                    ) : (
                                        <div className="auction-number">{auctionData.auctionNumber}</div>
                                    )}
                                    
                                    {adminMode ? (
                                        <input
                                            type="text"
                                            className="admin-input"
                                            value={auctionData.title}
                                            onChange={(e) => setAuctionData({ ...auctionData, title: e.target.value })}
                                            placeholder="Artwork Title"
                                        />
                                    ) : (
                                        <h1 className="artwork-title">{auctionData.title}</h1>
                                    )}
                                    
                                    {adminMode ? (
                                        <input
                                            type="text"
                                            className="admin-input"
                                            value={auctionData.artist}
                                            onChange={(e) => setAuctionData({ ...auctionData, artist: e.target.value })}
                                            placeholder="Artist Name"
                                        />
                                    ) : (
                                        <div className="artist-name">{auctionData.artist}</div>
                                    )}
                                </div>

                                {/* CURATOR'S NOTE */}
                                <div className="curators-note">
                                    <div className="curators-label">Curator's Note</div>
                                    {adminMode ? (
                                        <textarea
                                            className="edit-curator"
                                            value={auctionData.curatorNote}
                                            onChange={(e) => setAuctionData({ ...auctionData, curatorNote: e.target.value })}
                                        />
                                    ) : (
                                        <p className="curators-text">{auctionData.curatorNote}</p>
                                    )}
                                </div>

                                {/* BIDDING SECTION */}
                                <div className="bidding-section">
                                    {/* COUNTDOWN */}
                                    <div className="countdown-container">
                                        <div className="countdown-label">Auction Ends In</div>
                                        <div className="countdown">
                                            <div className="time-unit">
                                                <div className="time-value">{timeLeft.days || '00'}</div>
                                                <div className="time-label">Days</div>
                                            </div>
                                            <div className="time-unit">
                                                <div className="time-value">{timeLeft.hours || '00'}</div>
                                                <div className="time-label">Hours</div>
                                            </div>
                                            <div className="time-unit">
                                                <div className="time-value">{timeLeft.minutes || '00'}</div>
                                                <div className="time-label">Min</div>
                                            </div>
                                            <div className="time-unit">
                                                <div className="time-value">{timeLeft.seconds || '00'}</div>
                                                <div className="time-label">Sec</div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* CURRENT BID */}
                                    <div className="current-bid-section">
                                        <div className="bid-label">Current Bid</div>
                                        <div className="current-bid-amount">
                                            ${auctionData.currentBid.toLocaleString()}
                                        </div>
                                    </div>

                                    {/* BID INPUT */}
                                    <div className="bid-input-section">
                                        <input
                                            type="number"
                                            className="bid-input"
                                            placeholder="Enter your bid"
                                            value={newBid}
                                            onChange={(e) => setNewBid(e.target.value)}
                                        />
                                        <button className="place-bid-btn" onClick={handlePlaceBid}>
                                            Place Bid
                                        </button>
                                    </div>

                                    {/* BID HISTORY */}
                                    <div className="bid-history">
                                        <div className="bid-history-label">Recent Bids</div>
                                        {auctionData.bidHistory.map((bid, index) => (
                                            <div key={index} className="bid-item">
                                                <span className="bid-amount">${bid.amount.toLocaleString()}</span>
                                                <span className="bid-time">{bid.time}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* RIGHT COLUMN - ARTWORK */}
                            <div className="artwork-display">
                                <div className="artwork-card">
                                    <div className="artwork-frame">
                                        <img 
                                            src={auctionData.imageUrl} 
                                            alt={auctionData.title}
                                            className="artwork-image"
                                        />
                                    </div>
                                    
                                    {adminMode && (
                                        <div className="image-upload-section">
                                            <label className="image-upload-label">
                                                Click to upload artwork image
                                                <input type="file" accept="image/*" onChange={handleImageUpload} />
                                            </label>
                                        </div>
                                    )}

                                    <div className="artwork-details">
                                        <div className="detail-item">
                                            <div className="detail-label">Year</div>
                                            {adminMode ? (
                                                <input
                                                    type="text"
                                                    className="admin-input"
                                                    value={auctionData.year}
                                                    onChange={(e) => setAuctionData({ ...auctionData, year: e.target.value })}
                                                />
                                            ) : (
                                                <div className="detail-value">{auctionData.year}</div>
                                            )}
                                        </div>
                                        <div className="detail-item">
                                            <div className="detail-label">Medium</div>
                                            {adminMode ? (
                                                <input
                                                    type="text"
                                                    className="admin-input"
                                                    value={auctionData.medium}
                                                    onChange={(e) => setAuctionData({ ...auctionData, medium: e.target.value })}
                                                />
                                            ) : (
                                                <div className="detail-value">{auctionData.medium}</div>
                                            )}
                                        </div>
                                        <div className="detail-item">
                                            <div className="detail-label">Dimensions</div>
                                            {adminMode ? (
                                                <input
                                                    type="text"
                                                    className="admin-input"
                                                    value={auctionData.dimensions}
                                                    onChange={(e) => setAuctionData({ ...auctionData, dimensions: e.target.value })}
                                                />
                                            ) : (
                                                <div className="detail-value">{auctionData.dimensions}</div>
                                            )}
                                        </div>
                                        <div className="detail-item">
                                            <div className="detail-label">Edition</div>
                                            {adminMode ? (
                                                <input
                                                    type="text"
                                                    className="admin-input"
                                                    value={auctionData.edition}
                                                    onChange={(e) => setAuctionData({ ...auctionData, edition: e.target.value })}
                                                />
                                            ) : (
                                                <div className="detail-value">{auctionData.edition}</div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </>
            );
        }

        ReactDOM.render(<CalixMaison />, document.getElementById('root'));
    </script>
</body>
</html>

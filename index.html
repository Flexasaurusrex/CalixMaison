<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calix Maison - The House of Grails</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#C9A96E',
                        'off-white': '#f5f5f3',
                        'light-gray': '#e8e8e6',
                    },
                    fontFamily: {
                        serif: ['Cormorant Garamond', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>
<body class="bg-white text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function CalixMaison() {
            const [showLanding, setShowLanding] = useState(true);
            const [adminMode, setAdminMode] = useState(false);
            
            // Auction data state
            const [auctionData, setAuctionData] = useState({
                auctionNumber: 'WEEKLY CURATED AUCTION NO. 001',
                title: 'Convergence in Monochrome',
                artist: 'Elena Rousseau',
                curatorNote: "In Rousseau's latest work, we encounter a meditation on the space between intention and gesture. The layered monochromatic planes speak to a deliberate restraint—each mark considered, each absence as vital as presence. This piece emerged from her residency in Kyoto, where the philosophy of ma (間), the conscious use of negative space, profoundly influenced her practice. Here, Western gestural abstraction meets Eastern spatial consciousness, resulting in a work that breathes with quiet authority. The surface reveals itself slowly: what first appears as austere minimalism gradually unveils a complex topography of subtle tonalities and textures. It is this patience, this refusal to seduce immediately, that marks Rousseau as one of the most compelling voices in contemporary abstraction.",
                year: '2024',
                medium: 'Oil and graphite on canvas',
                dimensions: '48 × 36 inches',
                edition: 'Unique work',
                currentBid: 5000,
                bidHistory: [
                    { amount: 5000, time: '2 hours ago' },
                    { amount: 4500, time: '5 hours ago' },
                    { amount: 4000, time: '1 day ago' }
                ],
                imageUrl: 'https://images.unsplash.com/photo-1622547748225-3fc4abd2cca0?w=1200&q=80',
                endDate: new Date(Date.now() + 5 * 24 * 60 * 60 * 1000 + 14 * 60 * 60 * 1000)
            });

            const [newBid, setNewBid] = useState('');
            const [timeLeft, setTimeLeft] = useState({});

            // Countdown timer
            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date().getTime();
                    const distance = auctionData.endDate - now;

                    setTimeLeft({
                        days: Math.floor(distance / (1000 * 60 * 60 * 24)),
                        hours: Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                        minutes: Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)),
                        seconds: Math.floor((distance % (1000 * 60)) / 1000)
                    });
                }, 1000);

                return () => clearInterval(timer);
            }, [auctionData.endDate]);

            const handleEnter = () => {
                setShowLanding(false);
            };

            const handlePlaceBid = () => {
                const bidAmount = parseFloat(newBid);
                if (bidAmount > auctionData.currentBid) {
                    const newBidHistory = [
                        { amount: bidAmount, time: 'Just now' },
                        ...auctionData.bidHistory
                    ];
                    setAuctionData({
                        ...auctionData,
                        currentBid: bidAmount,
                        bidHistory: newBidHistory
                    });
                    setNewBid('');
                }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setAuctionData({ ...auctionData, imageUrl: reader.result });
                    };
                    reader.readAsDataURL(file);
                }
            };

            return (
                <>
                    {/* LANDING PAGE */}
                    <div className={`fixed inset-0 bg-black flex flex-col justify-center items-center z-50 transition-opacity duration-600 ${!showLanding ? 'opacity-0 pointer-events-none' : ''}`}>
                        <video 
                            className="w-full max-w-7xl h-auto mb-8 md:mb-12 px-4" 
                            autoPlay 
                            loop 
                            muted 
                            playsInline
                        >
                            <source src="assets/Calix_Maison_Symmetric.mp4" type="video/mp4" />
                        </video>
                        <button 
                            className="bg-transparent text-gold border-2 border-gold px-8 md:px-12 py-3 md:py-4 font-sans text-xs md:text-sm font-medium tracking-[3px] uppercase transition-all duration-400 hover:bg-gold hover:text-black hover:-translate-y-0.5 hover:shadow-2xl"
                            onClick={handleEnter}
                        >
                            Enter Maison
                        </button>
                    </div>

                    {/* HEADER */}
                    <header className="bg-gray-900 px-4 md:px-6 lg:px-12 py-4 md:py-6 sticky top-0 z-40 shadow-lg">
                        <div className="flex flex-col md:flex-row justify-between items-center gap-4 md:gap-0">
                            <div className="flex items-center gap-3 md:gap-6">
                                <img src="assets/CALIXMAISON.png" alt="Calix Maison" className="h-16 md:h-20 lg:h-24 w-auto" />
                                <div className="font-serif text-lg md:text-xl lg:text-2xl font-light text-gold tracking-wide italic">
                                    The House of Grails
                                </div>
                            </div>
                            <nav className="flex gap-4 md:gap-6 lg:gap-8 items-center flex-wrap justify-center">
                                <a href="#current" className="text-white text-[10px] md:text-xs font-normal tracking-widest uppercase transition-colors hover:text-gold">
                                    Current Auction
                                </a>
                                <a href="#archive" className="text-white text-[10px] md:text-xs font-normal tracking-widest uppercase transition-colors hover:text-gold">
                                    Archive
                                </a>
                                <a href="#about" className="text-white text-[10px] md:text-xs font-normal tracking-widest uppercase transition-colors hover:text-gold">
                                    About
                                </a>
                                <button 
                                    className="bg-gold text-black px-4 md:px-6 py-2 md:py-2.5 font-sans text-[10px] md:text-xs font-medium tracking-widest uppercase transition-all hover:bg-white hover:-translate-y-0.5 hover:shadow-md"
                                    onClick={() => setAdminMode(!adminMode)}
                                >
                                    Admin
                                </button>
                            </nav>
                        </div>
                    </header>

                    {/* MAIN CONTENT */}
                    <main className="max-w-7xl mx-auto px-4 md:px-6 lg:px-12 py-8 md:py-12 lg:py-16">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-16">
                            {/* LEFT COLUMN */}
                            <div className="flex flex-col gap-6 md:gap-8 lg:gap-10">
                                {/* TITLE SECTION */}
                                <div>
                                    {adminMode ? (
                                        <input
                                            type="text"
                                            className="w-full p-3 mt-2 font-sans border-2 border-gold bg-white focus:outline-none focus:shadow-lg text-sm"
                                            value={auctionData.auctionNumber}
                                            onChange={(e) => setAuctionData({ ...auctionData, auctionNumber: e.target.value })}
                                            placeholder="Auction Number"
                                        />
                                    ) : (
                                        <div className="text-xs tracking-[2px] uppercase text-gray-400 font-normal mb-3">
                                            {auctionData.auctionNumber}
                                        </div>
                                    )}
                                    
                                    {adminMode ? (
                                        <input
                                            type="text"
                                            className="w-full p-3 mt-2 font-sans border-2 border-gold bg-white focus:outline-none focus:shadow-lg text-2xl md:text-3xl"
                                            value={auctionData.title}
                                            onChange={(e) => setAuctionData({ ...auctionData, title: e.target.value })}
                                            placeholder="Artwork Title"
                                        />
                                    ) : (
                                        <h1 className="font-serif text-4xl md:text-5xl lg:text-6xl font-normal leading-tight mb-2">
                                            {auctionData.title}
                                        </h1>
                                    )}
                                    
                                    {adminMode ? (
                                        <input
                                            type="text"
                                            className="w-full p-3 mt-2 font-sans border-2 border-gold bg-white focus:outline-none focus:shadow-lg"
                                            value={auctionData.artist}
                                            onChange={(e) => setAuctionData({ ...auctionData, artist: e.target.value })}
                                            placeholder="Artist Name"
                                        />
                                    ) : (
                                        <div className="text-gold text-base md:text-lg font-normal tracking-wide">
                                            {auctionData.artist}
                                        </div>
                                    )}
                                </div>

                                {/* CURATOR'S NOTE */}
                                <div className="bg-off-white p-6 md:p-8 lg:p-10 border-l-4 border-gold shadow-sm">
                                    <div className="text-[10px] md:text-xs tracking-[2px] uppercase text-gray-400 mb-4 font-medium">
                                        Curator's Note
                                    </div>
                                    {adminMode ? (
                                        <textarea
                                            className="w-full min-h-[150px] md:min-h-[200px] p-4 font-serif text-base md:text-lg leading-relaxed border-2 border-gold bg-white resize-vertical focus:outline-none focus:shadow-lg"
                                            value={auctionData.curatorNote}
                                            onChange={(e) => setAuctionData({ ...auctionData, curatorNote: e.target.value })}
                                        />
                                    ) : (
                                        <p className="font-serif text-base md:text-lg leading-relaxed text-gray-900">
                                            {auctionData.curatorNote}
                                        </p>
                                    )}
                                </div>

                                {/* COUNTDOWN */}
                                <div className="bg-off-white p-6 md:p-8 shadow-sm">
                                    <div className="text-[10px] md:text-xs tracking-[2px] uppercase text-gray-400 mb-6 text-center font-medium">
                                        Auction Ends In
                                    </div>
                                    <div className="grid grid-cols-4 gap-3 md:gap-4 text-center">
                                        <div>
                                            <div className="text-3xl md:text-4xl lg:text-5xl font-light text-gray-900">
                                                {timeLeft.days || '00'}
                                            </div>
                                            <div className="text-[10px] tracking-widest uppercase text-gray-400 mt-2">
                                                Days
                                            </div>
                                        </div>
                                        <div>
                                            <div className="text-3xl md:text-4xl lg:text-5xl font-light text-gray-900">
                                                {timeLeft.hours || '00'}
                                            </div>
                                            <div className="text-[10px] tracking-widest uppercase text-gray-400 mt-2">
                                                Hours
                                            </div>
                                        </div>
                                        <div>
                                            <div className="text-3xl md:text-4xl lg:text-5xl font-light text-gray-900">
                                                {timeLeft.minutes || '00'}
                                            </div>
                                            <div className="text-[10px] tracking-widest uppercase text-gray-400 mt-2">
                                                Min
                                            </div>
                                        </div>
                                        <div>
                                            <div className="text-3xl md:text-4xl lg:text-5xl font-light text-gray-900">
                                                {timeLeft.seconds || '00'}
                                            </div>
                                            <div className="text-[10px] tracking-widest uppercase text-gray-400 mt-2">
                                                Sec
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* CURRENT BID */}
                                <div className="bg-off-white p-6 md:p-8 text-center shadow-sm">
                                    <div className="text-[10px] md:text-xs tracking-[2px] uppercase text-gray-400 mb-4 font-medium">
                                        Current Bid
                                    </div>
                                    <div className="text-4xl md:text-5xl lg:text-6xl font-light text-gold">
                                        ${auctionData.currentBid.toLocaleString()}
                                    </div>
                                </div>

                                {/* BID INPUT */}
                                <div className="flex flex-col sm:flex-row gap-3 md:gap-4">
                                    <input
                                        type="number"
                                        className="flex-1 p-3 md:p-4 text-base font-sans border-2 border-light-gray bg-white transition-all focus:outline-none focus:border-gold focus:shadow-lg"
                                        placeholder="Enter your bid"
                                        value={newBid}
                                        onChange={(e) => setNewBid(e.target.value)}
                                    />
                                    <button 
                                        className="bg-gray-900 text-white px-6 md:px-10 py-3 md:py-4 font-sans text-xs md:text-sm font-medium tracking-[2px] uppercase transition-all hover:bg-gold hover:text-black hover:-translate-y-0.5 hover:shadow-md whitespace-nowrap"
                                        onClick={handlePlaceBid}
                                    >
                                        Place Bid
                                    </button>
                                </div>

                                {/* BID HISTORY */}
                                <div className="bg-off-white p-6 md:p-8 shadow-sm">
                                    <div className="text-[10px] md:text-xs tracking-[2px] uppercase text-gray-400 mb-6 font-medium">
                                        Recent Bids
                                    </div>
                                    {auctionData.bidHistory.map((bid, index) => (
                                        <div key={index} className="flex justify-between py-3 md:py-4 border-b border-light-gray last:border-b-0">
                                            <span className="text-gold font-medium text-sm md:text-base">
                                                ${bid.amount.toLocaleString()}
                                            </span>
                                            <span className="text-gray-400 text-sm md:text-base">
                                                {bid.time}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* RIGHT COLUMN - ARTWORK */}
                            <div className="lg:sticky lg:top-32 lg:self-start">
                                <div className="bg-white p-6 md:p-8 lg:p-12 shadow-2xl">
                                    <div className="bg-off-white p-6 md:p-8 lg:p-10 shadow-sm mb-6 md:mb-8">
                                        <img 
                                            src={auctionData.imageUrl} 
                                            alt={auctionData.title}
                                            className="w-full h-auto block shadow-md"
                                        />
                                    </div>
                                    
                                    {adminMode && (
                                        <div className="mb-6 md:mb-8 p-4 bg-off-white border-2 border-dashed border-gold">
                                            <label className="block text-center cursor-pointer p-4 text-sm md:text-base text-gray-900">
                                                Click to upload artwork image
                                                <input type="file" className="hidden" accept="image/*" onChange={handleImageUpload} />
                                            </label>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-2 gap-4 md:gap-6 lg:gap-8 text-sm md:text-base">
                                        <div className="flex flex-col gap-2">
                                            <div className="text-[10px] tracking-[2px] uppercase text-gray-400 font-medium">
                                                Year
                                            </div>
                                            {adminMode ? (
                                                <input
                                                    type="text"
                                                    className="w-full p-2 md:p-3 font-sans border-2 border-gold bg-white focus:outline-none focus:shadow-lg"
                                                    value={auctionData.year}
                                                    onChange={(e) => setAuctionData({ ...auctionData, year: e.target.value })}
                                                />
                                            ) : (
                                                <div className="text-gray-900 font-normal">
                                                    {auctionData.year}
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex flex-col gap-2">
                                            <div className="text-[10px] tracking-[2px] uppercase text-gray-400 font-medium">
                                                Medium
                                            </div>
                                            {adminMode ? (
                                                <input
                                                    type="text"
                                                    className="w-full p-2 md:p-3 font-sans border-2 border-gold bg-white focus:outline-none focus:shadow-lg"
                                                    value={auctionData.medium}
                                                    onChange={(e) => setAuctionData({ ...auctionData, medium: e.target.value })}
                                                />
                                            ) : (
                                                <div className="text-gray-900 font-normal">
                                                    {auctionData.medium}
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex flex-col gap-2">
                                            <div className="text-[10px] tracking-[2px] uppercase text-gray-400 font-medium">
                                                Dimensions
                                            </div>
                                            {adminMode ? (
                                                <input
                                                    type="text"
                                                    className="w-full p-2 md:p-3 font-sans border-2 border-gold bg-white focus:outline-none focus:shadow-lg"
                                                    value={auctionData.dimensions}
                                                    onChange={(e) => setAuctionData({ ...auctionData, dimensions: e.target.value })}
                                                />
                                            ) : (
                                                <div className="text-gray-900 font-normal">
                                                    {auctionData.dimensions}
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex flex-col gap-2">
                                            <div className="text-[10px] tracking-[2px] uppercase text-gray-400 font-medium">
                                                Edition
                                            </div>
                                            {adminMode ? (
                                                <input
                                                    type="text"
                                                    className="w-full p-2 md:p-3 font-sans border-2 border-gold bg-white focus:outline-none focus:shadow-lg"
                                                    value={auctionData.edition}
                                                    onChange={(e) => setAuctionData({ ...auctionData, edition: e.target.value })}
                                                />
                                            ) : (
                                                <div className="text-gray-900 font-normal">
                                                    {auctionData.edition}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </>
            );
        }

        ReactDOM.render(<CalixMaison />, document.getElementById('root'));
    </script>
</body>
</html>
